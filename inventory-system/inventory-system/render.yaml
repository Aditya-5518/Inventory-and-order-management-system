# render.yaml — deploy backend on Render (free tier)
services:
  - type: web
    name: stockflow-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: stockflow-db
          property: connectionString
    autoDeploy: true

databases:
  - name: stockflow-db
    databaseName: inventory_db
    plan: free
